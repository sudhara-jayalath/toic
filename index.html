<style id="toic-css">
/* Layout: a street-poster front page (Jupiter-yellow hero, ticker band) over a quiet minute-book; five hash-routed pages share one header. */
:root {
  --paper: #f6f6f2;
  --paper-2: #ebeae4;
  --ink: #141412;
  --muted: #5c5b55;
  --rule: #d4d3cb;
  --jupiter: #f2b705;
  --on-jupiter: #141412;
  --hl: #f2b705;
  --band: #141412;
  --band-ink: #f6f6f2;
  --logo-filter: none;
  --display: "Gloock", "Iowan Old Style", Georgia, serif;
  --stencil: "Stardos Stencil", "Gloock", Georgia, serif;
  --body: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11110f; --paper-2: #1b1b18; --ink: #eeede7; --muted: #a29f96; --rule: #2e2d29;
    --jupiter: #ebb00c; --on-jupiter: #141412; --hl: #6e560b; --band: #1d1c19; --band-ink: #eeede7;
    --logo-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11110f; --paper-2: #1b1b18; --ink: #eeede7; --muted: #a29f96; --rule: #2e2d29;
  --jupiter: #ebb00c; --on-jupiter: #141412; --hl: #6e560b; --band: #1d1c19; --band-ink: #eeede7;
  --logo-filter: invert(1); color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.125rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.inner { max-width: 72rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
p { margin: 0; }
a { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.hero a:focus-visible { outline-color: var(--on-jupiter); }

.eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: clamp(2rem, 4.6vw, 3.3rem); line-height: 1.04; letter-spacing: -.005em; }
h3 { font-size: 1.5rem; line-height: 1.15; }
.prose { display: grid; gap: 1rem; max-width: 40rem; }
.pending { color: var(--muted); font-style: italic; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem 1.5rem; padding-block: .6rem; }
.brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; }
.brand img { height: 2.4rem; width: auto; filter: var(--logo-filter); }
.brand span { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; line-height: 1.25; }
.views { display: flex; flex-wrap: wrap; gap: .2rem; }
.views a { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; padding: .5rem .75rem; border-radius: 999px; }
.views a:hover { background: var(--paper-2); }
.views a[aria-current="page"] { background: var(--ink); color: var(--paper); }

/* buttons */
.actions { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn { display: inline-flex; align-items: center; gap: .55rem; font-family: var(--mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; padding: .9rem 1.25rem; border: 1.5px solid currentColor; background: transparent; color: inherit; cursor: pointer; transition: transform .15s ease; }
.btn:hover { transform: translateY(-2px); }
.btn.solid { background: var(--on-jupiter); color: var(--jupiter); border-color: var(--on-jupiter); }
.btn.ink { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.jup { background: var(--jupiter); color: var(--on-jupiter); border-color: var(--jupiter); }
.btn .arr { font-family: var(--body); font-size: 1rem; line-height: 1; }

/* hero */
.hero { background: var(--jupiter); color: var(--on-jupiter); }
.hero .eyebrow { color: var(--on-jupiter); opacity: .75; }
.hero .inner { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 2.5rem; align-items: center; padding-block: clamp(2.75rem, 7vw, 5.75rem); }
.hero-copy { display: grid; gap: 1.5rem; min-width: 0; }
.hero h1 { font-size: clamp(3rem, 9vw, 6.6rem); line-height: .93; letter-spacing: -.015em; }
.hero h1 span { display: inline-block; animation: rise .9s cubic-bezier(.2, .75, .2, 1) both; animation-delay: calc(var(--i) * 110ms); }
@keyframes rise { from { transform: translateY(.28em); } to { transform: none; } }
.hero .lede { font-size: clamp(1.1rem, 2.1vw, 1.35rem); max-width: 33rem; }
.hero-mark { display: grid; justify-items: center; gap: 1.1rem; }
.hero-mark .mark { width: min(15rem, 100%); height: auto; }
.hero-mark .word { width: min(19rem, 100%); height: auto; }

/* ticker */
.ticker { background: var(--band); color: var(--band-ink); overflow: hidden; white-space: nowrap; font-family: var(--mono); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; }
.ticker .track { display: inline-flex; padding-block: .8rem; animation: tick 46s linear infinite; }
.ticker span { padding-inline: 1.1rem; }
.ticker b { color: var(--jupiter); font-weight: 400; }
@keyframes tick { to { transform: translateX(-50%); } }

/* sections */
.section { padding-block: clamp(3.25rem, 7vw, 5.5rem); display: grid; gap: 2rem; }
.manifesto { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 2rem 4rem; align-items: start; }
.manifesto .lead { display: grid; gap: 1rem; }
.quote { font-family: var(--display); font-size: clamp(1.9rem, 4.6vw, 3.7rem); line-height: 1.1; max-width: 24ch; text-wrap: balance; padding-bottom: clamp(1rem, 4vw, 2.5rem); }
.quote mark { background: linear-gradient(transparent 58%, var(--hl) 58%); color: inherit; padding-inline: .05em; }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--ink); }
.timeline li { padding: 1.4rem 1.5rem 0 0; display: grid; gap: .5rem; align-content: start; min-width: 0; }
.timeline .t { font-family: var(--stencil); font-weight: 700; font-size: clamp(1.9rem, 3.4vw, 2.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.timeline h3 { font-size: 1.3rem; }
.timeline p { color: var(--muted); font-size: 1.02rem; }

.next { background: var(--paper-2); }
.next .inner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.5rem 2.5rem; align-items: center; padding-block: 2.5rem; }
.next .num { font-family: var(--stencil); font-weight: 700; font-size: clamp(4rem, 9vw, 6.5rem); line-height: .8; }
.next .body { display: grid; gap: .4rem; min-width: 0; }
.next .meta { font-family: var(--mono); font-size: .8rem; color: var(--muted); }

.road { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
.road article { display: grid; gap: .6rem; align-content: start; padding-top: 1rem; border-top: 2px solid var(--ink); }
.road article:first-child { border-top-color: var(--jupiter); }
.road .stage { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
.road p { color: var(--muted); }

.band { background: var(--band); color: var(--band-ink); }
.band .eyebrow { color: var(--band-ink); opacity: .7; }
.band .inner { display: grid; grid-template-columns: minmax(0, 1.4fr) auto; gap: 2rem; align-items: end; padding-block: clamp(3rem, 6vw, 4.5rem); }
.band .copy { display: grid; gap: .9rem; }
.band .copy p:last-child { opacity: .8; max-width: 34rem; }

/* page heads */
.page-head { padding-block: clamp(2.75rem, 6vw, 4.5rem) 2rem; display: grid; gap: 1rem; border-bottom: 2px solid var(--ink); }
.page-head .intro { max-width: 40rem; font-size: 1.2rem; }

/* records */
.recs { display: grid; }
.rec { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1.5rem; padding-block: 2.5rem; border-bottom: 1px solid var(--rule); }
.rec .num { font-family: var(--stencil); font-weight: 700; font-size: clamp(3.5rem, 7vw, 5rem); line-height: .82; font-variant-numeric: tabular-nums; }
.rec-body { display: grid; gap: .9rem; min-width: 0; max-width: 46rem; }
.rec-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .9rem; font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.chip { display: inline-block; font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; padding: .22rem .55rem; border: 1px solid var(--ink); color: var(--ink); }
.chip.up { background: var(--jupiter); border-color: var(--jupiter); color: var(--on-jupiter); }
.rec .q { font-family: var(--display); font-size: clamp(1.3rem, 2.4vw, 1.65rem); line-height: 1.25; }
.fields { display: grid; gap: .8rem; margin: .25rem 0 0; }
.fields > div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1rem; }
.fields dt { font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: .35rem; }
.fields dd { margin: 0; display: grid; gap: .6rem; }
.ins { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.ins li { position: relative; padding-left: 1.4rem; }
.ins li::before { content: ""; position: absolute; left: 0; top: .62em; width: .55rem; height: .55rem; background: var(--jupiter); }

/* chamber */
.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 1.5rem; padding-block: 2.5rem 4rem; }
.member { border: 1.5px solid var(--ink); padding: 1.6rem; display: grid; gap: 1rem; align-content: start; min-width: 0; }
.m-head { display: flex; gap: 1rem; align-items: center; }
.tile { flex: none; width: 3.6rem; height: 3.6rem; display: grid; place-items: center; background: var(--jupiter); color: var(--on-jupiter); font-family: var(--stencil); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; }
.m-line { font-family: var(--mono); font-size: .76rem; color: var(--muted); line-height: 1.45; margin-top: .2rem; }
.theory { margin: 0; display: grid; gap: .3rem; padding-block: .9rem; border-block: 1px solid var(--rule); }
.theory p { font-family: var(--display); font-size: 1.3rem; line-height: 1.22; }
.m-foot { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
.member.join { border-style: dashed; background: var(--paper-2); border-color: var(--muted); }
.member.join ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; }

/* letters */
.letters { display: grid; padding-block: 1rem 4rem; }
.letter { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: 1.5rem; padding-block: 2.25rem; border-bottom: 1px solid var(--rule); }
.letter .when { font-family: var(--mono); font-size: .78rem; color: var(--muted); display: grid; gap: .2rem; align-content: start; }
.letter .when b { font-family: var(--stencil); font-weight: 700; font-size: 2.4rem; color: var(--ink); line-height: 1; }
.letter .prose { max-width: 42rem; }
.empty { padding: 2.5rem 0 4rem; display: grid; gap: .6rem; max-width: 36rem; }
.empty h3 { font-size: 1.6rem; }
.how { font-size: .98rem; color: var(--muted); max-width: 38rem; }

/* founder */
.founder { display: grid; grid-template-columns: minmax(0, 18rem) minmax(0, 1fr); gap: 2.5rem 4.5rem; padding-block: clamp(2.75rem, 6vw, 4.5rem) 4.5rem; }
.f-side { display: grid; gap: 1rem; align-content: start; }
.f-tile { aspect-ratio: 1; max-width: 100%; background: var(--jupiter); color: var(--on-jupiter); display: grid; place-items: center; font-family: var(--stencil); font-weight: 700; font-size: clamp(4rem, 10vw, 7rem); line-height: 1; }
.f-main { display: grid; gap: 1.4rem; min-width: 0; }
.f-role { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
.f-main h2 { font-size: clamp(2.4rem, 5.5vw, 4rem); }
.theories { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 2px solid var(--ink); max-width: 42rem; }
.theories li { font-family: var(--display); font-size: clamp(1.35rem, 2.6vw, 1.85rem); line-height: 1.2; padding-block: 1rem; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 2rem minmax(0, 1fr); }
.theories li::before { content: "\201C"; font-family: var(--stencil); font-weight: 700; color: var(--jupiter); font-size: 1.1em; }

.elsewhere { display: grid; gap: .7rem; max-width: 42rem; padding: 1.5rem; margin-top: .5rem; background: var(--paper-2); }
.elsewhere p:not(.eyebrow) { color: var(--muted); }
.elsewhere .actions { margin-top: .3rem; }

/* footer */
footer { border-top: 1px solid var(--rule); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 1.5rem; padding-block: 2.5rem 3rem; }
.foot .word { width: min(17rem, 100%); height: auto; filter: var(--logo-filter); }
.small { font-family: var(--mono); font-size: .74rem; color: var(--muted); line-height: 1.6; }
.foot .guru { max-width: 26rem; }

/* editing */
.ed { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; background: transparent; color: var(--ink); border: 1px dashed var(--ink); padding: .45rem .7rem; cursor: pointer; justify-self: start; }
.ed:hover { background: var(--paper-2); }
body:not(.editing) .ed { display: none; }
.edbar { background: var(--paper-2); border-bottom: 1px dashed var(--ink); }
.edbar .inner { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding-block: .6rem; font-family: var(--mono); font-size: .74rem; }
.edbar .inner span { flex: 1 1 16rem; color: var(--muted); }
body:not(.editing) .edbar { display: none; }
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; font-family: var(--mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: 0; padding: .8rem 1.1rem; cursor: pointer; box-shadow: 0 6px 20px rgb(0 0 0 / .18); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: .78rem; padding: .7rem 1rem; max-width: calc(100vw - 32px); box-sizing: border-box; }
dialog { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: 0; width: min(40rem, calc(100vw - 32px)); max-height: calc(100dvh - 32px); box-sizing: border-box; }
dialog::backdrop { background: rgb(0 0 0 / .5); }
.dlg { display: grid; gap: 1rem; padding: 1.5rem; }
.field { display: grid; gap: .3rem; }
.field label { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field .hint { font-size: .85rem; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; font-size: 1rem; padding: .6rem .7rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 0; width: 100%; box-sizing: border-box; }
.field textarea { min-height: 7.5rem; resize: vertical; line-height: 1.5; }
.dlg-actions { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; padding-top: .5rem; }
.dlg-actions .right { display: flex; gap: .6rem; flex-wrap: wrap; }
.btn.danger { color: #b3261e; border-color: #b3261e; }

/* responsive */
@media (max-width: 860px) {
  .hero .inner { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
  .hero-mark { order: -1; justify-items: start; grid-auto-flow: column; align-items: end; gap: 1rem; }
  .hero-mark .mark { width: 5.5rem; }
  .hero-mark .word { width: min(14rem, 60vw); }
  .manifesto { grid-template-columns: minmax(0, 1fr); }
  .timeline { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 1.75rem; }
  .road { grid-template-columns: minmax(0, 1fr); }
  .band .inner { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .next .inner { grid-template-columns: auto minmax(0, 1fr); }
  .next .inner .btn { grid-column: 1 / -1; justify-self: start; }
  .founder { grid-template-columns: minmax(0, 1fr); }
  .f-side { grid-template-columns: 7rem minmax(0, 1fr); align-items: end; }
  .f-tile { font-size: 3rem; }
}
@media (max-width: 560px) {
  .timeline { grid-template-columns: minmax(0, 1fr); }
  .rec, .letter { grid-template-columns: minmax(0, 1fr); gap: .75rem; }
  .fields > div { grid-template-columns: minmax(0, 1fr); gap: .2rem; }
  .brand span { display: none; }
  .views a { padding: .45rem .5rem; font-size: .66rem; letter-spacing: .05em; }
}
@media (prefers-reduced-motion: reduce) {
  .hero h1 span, .ticker .track { animation: none; }
  .btn { transition: none; }
}
</style>

<script id="toic-app">
(function () {
  "use strict";
  var dataEl = document.getElementById("toic-data");
  var assetEl = document.getElementById("toic-assets");
  var S;
  try { S = JSON.parse(dataEl.textContent); } catch (e) { S = {}; }
  S.settings = S.settings || {}; S.sessions = S.sessions || []; S.members = S.members || []; S.letters = S.letters || []; S.founder = S.founder || {};
  var A = JSON.parse(assetEl.textContent);
  var MARK = "data:image/png;base64," + A.mark, WORD = "data:image/png;base64," + A.word;
  var app = document.getElementById("app");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\/\S+$/i.test(u) ? u : ""; }
  function paras(t) { return String(t || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean); }
  function P(t) { return paras(t).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join(""); }
  function initials(n) { return String(n || "?").trim().split(/\s+/).map(function (w) { return w.charAt(0); }).slice(0, 2).join("").toUpperCase(); }
  function pend(t) { return '<span class="pending">' + esc(t) + "</span>"; }
  function ext(href, label, cls) { return '<a class="' + cls + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + label + ' <span class="arr" aria-hidden="true">&#8599;</span></a>'; }

  var MEETUP_SEARCH = "https://www.meetup.com/find/?keywords=the%20ordinary%20inquiry%20club";
  var VIEWS = [["club", "Club"], ["records", "Records"], ["chamber", "Chamber"], ["letter", "Letter"], ["founder", "About me"]];

  function joinUrl() { return safeUrl(S.settings.meetupUrl) || MEETUP_SEARCH; }
  function letterUrl() { return safeUrl(S.settings.letterUrl); }

  /* ---------- views ---------- */
  function club() {
    var s = S.settings;
    var next = S.sessions.filter(function (x) { return x.status === "upcoming"; })[0];
    var tickItems = [s.when || "Thursdays 18:00–20:00", "St. Pauli, Hamburg", "Up to 8 at the table", "One question", "No history lessons", "Bring your own theory", "Guruvāra: the day of the teacher"];
    var tick = tickItems.map(function (t) { return "<span>" + esc(t) + "</span><span><b>&#x2643;&#xFE0E;</b></span>"; }).join("");
    var nextBlock = next ? (
      '<div class="next"><div class="inner">' +
        '<div class="num" aria-hidden="true">' + esc(next.no) + "</div>" +
        '<div class="body"><p class="eyebrow">Next at the table</p><h3>' + (next.topic ? esc(next.topic) : "Topic to be announced") + "</h3>" +
        '<p class="meta">' + esc([next.date, next.place].filter(Boolean).join(" · ")) + "</p></div>" +
        ext(joinUrl(), "RSVP on Meetup", "btn ink") +
      "</div></div>") : "";
    return (
      '<div class="hero"><div class="inner">' +
        '<div class="hero-copy">' +
          '<p class="eyebrow">Hamburg · St. Pauli · Thursdays</p>' +
          '<h1><span style="--i:0">Do you have</span> <span style="--i:1">your own</span> <span style="--i:2">theory?</span></h1>' +
          '<p class="lede">A small table for free thinkers. Once a week, up to eight people sit down with one question and think out loud, in their own words.</p>' +
          '<div class="actions">' + ext(joinUrl(), "Join on Meetup", "btn solid") + '<a class="btn" href="#records">Read the records</a></div>' +
        "</div>" +
        '<div class="hero-mark"><img class="mark" src="' + MARK + '" alt="The club mark: IO above 1O"><img class="word" src="' + WORD + '" alt="1he 0dinary 1nquiry 0lub"></div>' +
      "</div></div>" +
      '<div class="ticker" aria-hidden="true"><div class="track">' + tick + tick + "</div></div>" +

      '<div class="inner section manifesto">' +
        '<div class="lead"><p class="eyebrow">The idea</p><h2>Philosophers by life, by vocation, by passion</h2></div>' +
        '<div class="prose">' +
          "<p>Are you a free thinker, a philosopher on your own terms? If you're enchanted by life and its mysteries, if you like to analyze and describe the world and existence in your own way, and if you're curious how the people around you creatively make sense of it, this club is for you.</p>" +
          "<p>You don't need to be a philosopher by profession. It's enough to be one by life, by vocation, and by passion.</p>" +
          "<p>We meet in small groups of up to eight people to explore one focused topic at a time. We won't dive into the history of philosophy, and we're not concerned with how philosophy is practiced in institutions. Here, your own thinking is the starting point.</p>" +
        "</div>" +
      "</div>" +
      '<div class="inner"><p class="quote"><mark>Let’s rescue philosophy from history books and institutions,</mark> and bring it back to the streets.</p></div>' +

      '<div class="inner section">' +
        '<div class="lead"><p class="eyebrow">A Thursday at the table</p><h2>Two hours, one question</h2></div>' +
        '<ol class="timeline">' +
          '<li><span class="t">18:00</span><h3>We sit down</h3><p>One table in a St. Pauli café, up to eight people. A drink or two is plenty.</p></li>' +
          '<li><span class="t">18:10</span><h3>One question</h3><p>A focused topic, announced a few days before on Meetup.</p></li>' +
          '<li><span class="t">→20:00</span><h3>Your own words</h3><p>Everyone thinks from their own life. No famous names needed to make a point.</p></li>' +
          '<li><span class="t">After</span><h3>The record</h3><p>The question, the threads and what we found go into the minute-book.</p></li>' +
        "</ol>" +
      "</div>" +
      nextBlock +

      '<div class="inner section">' +
        '<div class="lead"><p class="eyebrow">Where the records lead</p><h2>From a table, to a book, to the street</h2></div>' +
        '<div class="road">' +
          '<article><span class="stage">Now</span><h3>The minute-book</h3><p>Every session leaves a record: the question, the threads, and what we found together.</p><a class="btn" href="#records">Open the records</a></article>' +
          '<article><span class="stage">Next</span><h3>A book, written together</h3><p>Over time the records become a shared book. Everyone whose thinking shaped a session can become a co-author.</p></article>' +
          '<article><span class="stage">Someday</span><h3>A street philosophy conference</h3><p>A gathering in public space for people who think by vocation rather than profession. No podium, only tables.</p></article>' +
        "</div>" +
      "</div>" +

      '<div class="band"><div class="inner">' +
        '<div class="copy"><p class="eyebrow">The Thursday Letter</p><h2>One short letter after each session</h2><p>The question we asked, the threads worth keeping, and the next topic. Nothing else.</p></div>' +
        '<div class="actions">' + (letterUrl() ? ext(letterUrl(), "Subscribe", "btn jup") : ext(joinUrl(), "Get it via Meetup", "btn jup")) + '<a class="btn" href="#letter">Past letters</a></div>' +
      "</div></div>"
    );
  }

  function records() {
    var n = S.sessions.length;
    var list = S.sessions.map(function (x) {
      var ins = (x.insights || []).filter(Boolean);
      var up = x.status === "upcoming";
      return (
        '<article class="rec" id="session-' + esc(x.no) + '">' +
          '<div class="num" aria-hidden="true">' + esc(x.no) + "</div>" +
          '<div class="rec-body">' +
            '<div class="rec-meta"><span class="chip' + (up ? " up" : "") + '">' + (up ? "Upcoming" : "Recorded") + "</span><span>No. " + esc(x.no) + "</span>" + (x.date ? "<span>" + esc(x.date) + "</span>" : "") + (x.place ? "<span>" + esc(x.place) + "</span>" : "") + "</div>" +
            "<h3>" + (x.topic ? esc(x.topic) : "Topic to be announced") + "</h3>" +
            (x.question ? '<p class="q">' + esc(x.question) + "</p>" : "") +
            '<dl class="fields">' +
              "<div><dt>Threads</dt><dd>" + (x.threads ? P(x.threads) : pend(up ? "Written up after the session" : "Not recorded")) + "</dd></div>" +
              "<div><dt>Insights</dt><dd>" + (ins.length ? '<ul class="ins">' + ins.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>" : pend(up ? "Written up after the session" : "Not recorded")) + "</dd></div>" +
              "<div><dt>At the table</dt><dd>" + (x.table ? esc(x.table) : pend("Up to 8")) + "</dd></div>" +
            "</dl>" +
            '<button type="button" class="ed" data-act="edit" data-kind="session" data-id="' + esc(x.id) + '">Edit this record</button>' +
          "</div>" +
        "</article>"
      );
    }).join("");
    return (
      '<div class="inner page-head"><p class="eyebrow">Records · ' + n + (n === 1 ? " session" : " sessions") + "</p><h2>The minute-book</h2>" +
      '<p class="intro">After each session we write down the question, the threads that came up and what we found. Names appear only with consent.</p>' +
      '<button type="button" class="ed" data-act="add" data-kind="session">+ Add a session</button></div>' +
      '<div class="inner recs">' + (list || '<div class="empty"><h3>No sessions yet</h3><p>The first record appears here after session No. 01.</p></div>') + "</div>"
    );
  }

  function chamber() {
    var n = S.members.length;
    var cards = S.members.map(function (m) {
      var link = safeUrl(m.link);
      var foot = [m.since ? "Member since " + esc(m.since) : "", link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(link.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "")) + "</a>" : ""].filter(Boolean).join(" · ");
      return (
        '<article class="member">' +
          '<div class="m-head"><div class="tile" aria-hidden="true">' + esc(initials(m.name)) + "</div><div><h3>" + esc(m.name) + "</h3>" + (m.line ? '<p class="m-line">' + esc(m.line) + "</p>" : "") + "</div></div>" +
          (m.theory ? '<blockquote class="theory"><span class="eyebrow">Own theory</span><p>' + esc(m.theory) + "</p></blockquote>" : "") +
          (m.bio ? '<div class="prose">' + P(m.bio) + "</div>" : "") +
          (foot ? '<p class="m-foot">' + foot + "</p>" : "") +
          '<button type="button" class="ed" data-act="edit" data-kind="member" data-id="' + esc(m.id) + '">Edit member</button>' +
        "</article>"
      );
    }).join("");
    var join =
      '<article class="member join"><p class="eyebrow">Your page here</p><h3>Join the chamber</h3>' +
      "<p>Came to a Thursday and want a place here? Send the organizer four things:</p>" +
      "<ul><li>your name, as you'd like it shown</li><li>one line on what you do, by profession or by passion</li><li>your own theory, in one sentence</li><li>a short bio of up to 80 words</li></ul>" +
      '<p class="m-foot">Message us on Meetup or bring it to the next session.</p></article>';
    return (
      '<div class="inner page-head"><p class="eyebrow">Chamber of Members · ' + n + "</p><h2>The people at the table</h2>" +
      '<p class="intro">Short biographies of the people who think with us. Each one names a theory of their own.</p>' +
      '<button type="button" class="ed" data-act="add" data-kind="member">+ Add a member</button></div>' +
      '<div class="inner"><div class="members">' + cards + join + "</div></div>"
    );
  }

  function letter() {
    var list = S.letters.map(function (l) {
      return (
        '<article class="letter"><div class="when"><b>' + esc(l.no) + "</b><span>" + esc(l.date) + "</span></div>" +
        '<div class="prose"><h3>' + esc(l.title) + "</h3>" + P(l.body) +
        '<button type="button" class="ed" data-act="edit" data-kind="letter" data-id="' + esc(l.id) + '">Edit letter</button></div></article>'
      );
    }).join("");
    var sub = letterUrl() ? ext(letterUrl(), "Subscribe to the letter", "btn ink") : ext(joinUrl(), "Join on Meetup to receive it", "btn ink");
    return (
      '<div class="inner page-head"><p class="eyebrow">The Thursday Letter</p><h2>Letters from the table</h2>' +
      '<p class="intro">After each session, one short letter: the question we asked, the threads worth keeping, and the next topic.</p>' +
      '<div class="actions">' + sub + "</div>" +
      '<p class="how">' + (letterUrl() ? "Subscribing opens our newsletter page in a new tab. Every letter is also archived here." : "Until the email list opens, every letter goes out to members of our Meetup group and is archived here.") + "</p>" +
      '<button type="button" class="ed" data-act="add" data-kind="letter">+ Add a letter</button></div>' +
      '<div class="inner letters">' + (list || '<div class="empty"><h3>No letters yet</h3><p>The first letter goes out after session No. 01.</p></div>') + "</div>"
    );
  }

  function founder() {
    var f = S.founder;
    var th = (f.theories || []).filter(Boolean);
    return (
      '<div class="inner founder">' +
        '<div class="f-side"><div class="f-tile" aria-hidden="true">' + esc(initials(f.name)) + '</div><p class="eyebrow">About me · Founder</p></div>' +
        '<div class="f-main">' +
          "<h2>" + esc(f.name) + "</h2>" + (f.role ? '<p class="f-role">' + esc(f.role) + "</p>" : "") +
          '<div class="prose">' + P(f.body) + "</div>" +
          (th.length ? '<p class="eyebrow">Some of my own theories</p><ul class="theories">' + th.map(function (t) { return "<li><span>" + esc(t) + "</span></li>"; }).join("") + "</ul>" : "") +
          (safeUrl(f.blogUrl) ? '<div class="elsewhere"><p class="eyebrow">Elsewhere \u00b7 my blog</p><h3>' + esc(f.blogName || "My blog") + "</h3>" + (f.blogNote ? "<p>" + esc(f.blogNote) + "</p>" : "") + '<div class="actions">' + ext(safeUrl(f.blogUrl), "Read " + esc(f.blogName || "the blog"), "btn ink") + "</div></div>" : "") +
          '<button type="button" class="ed" data-act="edit" data-kind="founder">Edit about me</button>' +
        "</div>" +
      "</div>"
    );
  }

  function render() {
    app.innerHTML =
      '<header class="top"><div class="inner">' +
        '<a class="brand" href="#club"><img src="' + MARK + '" alt=""><span>the ordinary<br>inquiry club</span></a>' +
        '<nav class="views" aria-label="Pages">' + VIEWS.map(function (v) { return '<a href="#' + v[0] + '" data-v="' + v[0] + '">' + v[1] + "</a>"; }).join("") + "</nav>" +
      "</div></header>" +
      '<div class="edbar"><div class="inner"><span>Editing. Each save publishes a new version of the site.</span>' +
        '<button type="button" class="ed" data-act="edit" data-kind="settings">Links &amp; schedule</button>' +
        '<button type="button" class="ed" id="ed-done">Done editing</button></div></div>' +
      "<main>" +
        '<section data-view="club">' + club() + "</section>" +
        '<section data-view="records" hidden>' + records() + "</section>" +
        '<section data-view="chamber" hidden>' + chamber() + "</section>" +
        '<section data-view="letter" hidden>' + letter() + "</section>" +
        '<section data-view="founder" hidden>' + founder() + "</section>" +
      "</main>" +
      '<footer><div class="inner foot">' +
        '<div><img class="word" src="' + WORD + '" alt="1he 0dinary 1nquiry 0lub"><p class="small">Hamburg · St. Pauli · founded November 2026</p></div>' +
        '<p class="small guru">&#x2643;&#xFE0E; Thursday is Guruvāra in Sanskrit: the day of Bṛhaspati, teacher of the gods and lord of speech.</p>' +
      "</div></footer>" +
      '<button type="button" class="fab" id="fab" hidden>Edit site</button>' +
      '<dialog id="dlg" aria-labelledby="dlg-title"><form id="dlg-form" class="dlg"></form></dialog>' +
      '<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>';
  }

  /* ---------- routing ---------- */
  function route(scroll) {
    var h = location.hash.replace(/^#/, "");
    var v = VIEWS.some(function (x) { return x[0] === h; }) ? h : "club";
    Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (s) { s.hidden = s.getAttribute("data-view") !== v; });
    Array.prototype.forEach.call(document.querySelectorAll(".views a"), function (a) { if (a.getAttribute("data-v") === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (scroll) window.scrollTo(0, 0);
  }

  render();
  route(false);
  window.addEventListener("hashchange", function () { route(true); });

  /* ---------- editing (owner and editors only) ---------- */
  var ART = null;
  var fab = document.getElementById("fab");
  var dlg = document.getElementById("dlg");
  var form = document.getElementById("dlg-form");
  var toastEl = document.getElementById("toast");
  var toastT = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastT); if (ms) toastT = setTimeout(function () { toastEl.hidden = true; }, ms);
  }
  function setEditing(on) {
    document.body.classList.toggle("editing", on);
    fab.textContent = on ? "Stop editing" : "Edit site";
  }
  fab.addEventListener("click", function () { setEditing(!document.body.classList.contains("editing")); });
  document.getElementById("ed-done").addEventListener("click", function () { setEditing(false); });

  (function initEditor() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
      var art = r[0], user = r[1];
      if (!art || !user) return null;
      return user.canEdit().then(function (ok) { if (ok) { ART = art; fab.hidden = false; } });
    }).catch(function () {});
  })();

  var SCHEMA = {
    session: { key: "sessions", title: "Session record", fields: [
      ["no", "Number", "text", "Two digits, e.g. 02"],
      ["status", "Status", "select", ["upcoming", "recorded"]],
      ["date", "Date and time", "text", "e.g. Thursday 13 November 2026, 18:00–20:00"],
      ["place", "Place", "text", "e.g. Kaffee Stark, St. Pauli"],
      ["topic", "Topic", "text"],
      ["question", "Opening question", "textarea"],
      ["threads", "Threads: what came up", "textarea", "Leave a blank line between paragraphs."],
      ["insights", "Insights", "lines", "One insight per line."],
      ["table", "At the table", "text", "e.g. 7 people · names only with consent"]
    ] },
    member: { key: "members", title: "Member", append: true, fields: [
      ["name", "Name", "text"],
      ["line", "One line", "text", "What they do, by profession or by passion"],
      ["theory", "Own theory, in one sentence", "text"],
      ["bio", "Short bio", "textarea", "Up to about 80 words."],
      ["link", "Link (optional)", "url", "A full address starting with https://"],
      ["since", "Member since", "text", "e.g. November 2026"]
    ] },
    letter: { key: "letters", title: "Thursday Letter", fields: [
      ["no", "Number", "text", "e.g. 01"],
      ["date", "Date", "text"],
      ["title", "Title", "text"],
      ["body", "Letter", "textarea", "Leave a blank line between paragraphs."]
    ] },
    founder: { key: "founder", single: true, title: "About me", fields: [
      ["name", "Name", "text"],
      ["role", "One line", "text"],
      ["body", "About me", "textarea", "Leave a blank line between paragraphs."],
      ["theories", "Some of my own theories", "lines", "One theory per line."],
      ["blogName", "Blog name", "text", "e.g. Nachplatz"],
      ["blogUrl", "Blog link", "url", "A full address starting with https://"],
      ["blogNote", "One line about the blog", "text"]
    ] },
    settings: { key: "settings", single: true, title: "Links & schedule", fields: [
      ["meetupUrl", "Meetup group link", "url", "Used by every Join and RSVP button. Without it they open a Meetup search."],
      ["letterUrl", "Newsletter sign-up link (optional)", "url", "e.g. a Buttondown or Substack page. Without it, the letter points to Meetup."],
      ["when", "When (shown in the ticker)", "text", "e.g. Thursdays 18:00–20:00"]
    ] }
  };

  function fieldHtml(f, obj) {
    var name = f[0], label = f[1], type = f[2], extra = f[3];
    var id = "f-" + name, v = obj[name];
    var hint = typeof extra === "string" ? '<span class="hint">' + esc(extra) + "</span>" : "";
    var ctl;
    if (type === "textarea") ctl = '<textarea id="' + id + '" name="' + name + '">' + esc(v || "") + "</textarea>";
    else if (type === "lines") ctl = '<textarea id="' + id + '" name="' + name + '">' + esc((v || []).join("\n")) + "</textarea>";
    else if (type === "select") ctl = '<select id="' + id + '" name="' + name + '">' + extra.map(function (o) { return '<option value="' + o + '"' + (v === o ? " selected" : "") + ">" + o.charAt(0).toUpperCase() + o.slice(1) + "</option>"; }).join("") + "</select>";
    else ctl = '<input id="' + id + '" name="' + name + '" type="' + (type === "url" ? "url" : "text") + '" value="' + esc(v || "") + '">';
    return '<div class="field"><label for="' + id + '">' + esc(label) + "</label>" + ctl + hint + "</div>";
  }

  function nextNo() {
    var max = 0;
    S.sessions.forEach(function (x) { var n = parseInt(x.no, 10); if (n > max) max = n; });
    return String(max + 1).padStart(2, "0");
  }

  var current = null;
  function openForm(kind, id, isNew) {
    var sc = SCHEMA[kind];
    var obj;
    if (sc.single) obj = S[sc.key] || {};
    else if (isNew) obj = kind === "session" ? { no: nextNo(), status: "upcoming", table: "Up to 8 people" } : kind === "letter" ? { no: String(S.letters.length + 1).padStart(2, "0") } : {};
    else obj = S[sc.key].filter(function (x) { return x.id === id; })[0];
    if (!obj) return;
    current = { kind: kind, id: id, isNew: isNew };
    var canDelete = !sc.single && !isNew;
    form.innerHTML =
      '<h3 id="dlg-title">' + (isNew ? "New " : "Edit ") + esc(sc.title.toLowerCase()) + "</h3>" +
      sc.fields.map(function (f) { return fieldHtml(f, obj); }).join("") +
      '<div class="dlg-actions">' +
        (canDelete ? '<button type="button" class="btn danger" id="dlg-del">Delete</button>' : "<span></span>") +
        '<div class="right"><button type="button" class="btn" id="dlg-cancel">Cancel</button><button type="submit" class="btn ink">Save and publish</button></div>' +
      "</div>";
    document.getElementById("dlg-cancel").addEventListener("click", function () { dlg.close(); });
    var del = document.getElementById("dlg-del");
    if (del) del.addEventListener("click", function () {
      if (del.getAttribute("data-armed") !== "1") { del.setAttribute("data-armed", "1"); del.textContent = "Click again to delete"; return; }
      var next = JSON.parse(JSON.stringify(S));
      next[sc.key] = next[sc.key].filter(function (x) { return x.id !== current.id; });
      dlg.close(); publish(next);
    });
    dlg.showModal();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!current) return;
    var sc = SCHEMA[current.kind];
    var fd = new FormData(form);
    var obj = {};
    sc.fields.forEach(function (f) {
      var raw = String(fd.get(f[0]) || "");
      obj[f[0]] = f[2] === "lines" ? raw.split("\n").map(function (s) { return s.trim(); }).filter(Boolean) : raw.trim();
    });
    var next = JSON.parse(JSON.stringify(S));
    if (sc.single) next[sc.key] = Object.assign({}, next[sc.key], obj);
    else if (current.isNew) {
      obj.id = current.kind.charAt(0) + Date.now().toString(36);
      if (sc.append) next[sc.key].push(obj); else next[sc.key].unshift(obj);
    } else {
      next[sc.key] = next[sc.key].map(function (x) { return x.id === current.id ? Object.assign({ id: x.id }, obj) : x; });
    }
    dlg.close();
    publish(next);
  });

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || !ART) return;
    openForm(b.getAttribute("data-kind"), b.getAttribute("data-id"), b.getAttribute("data-act") === "add");
  });

  var SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  var SC = "<" + "/script>";
  function buildDoc(state) {
    var head = Array.prototype.map.call(document.querySelectorAll('title, meta[name="claude:viewport-fit-sides"], link[data-toic]'), function (el) { return el.outerHTML; }).join("\n");
    var css = document.getElementById("toic-css").textContent;
    var code = document.getElementById("toic-app").textContent;
    var data = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
    return SKELETON + "\n" + head + '\n<style id="toic-css">' + css + "</style>\n" + '<div id="app"></div>\n' +
      '<script type="application/json" id="toic-data">' + data + SC + "\n" +
      '<script type="application/json" id="toic-assets">' + assetEl.textContent + SC + "\n" +
      '<script id="toic-app">' + code + SC + "\n</body></html>";
  }

  function publish(state) {
    if (!ART) return;
    toast("Publishing…");
    ART.publish(buildDoc(state)).then(function () {
      toast("Published. Reloading…");
    }).catch(function (err) {
      var c = err && err.code;
      if (c === "conflict") toast("A newer version was just published. Loading it…");
      else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required" || c === "capability_disabled" || c === "capability_removed") {
        toast("This view is read-only, so changes can’t be saved here.", 6000);
        fab.hidden = true; setEditing(false); ART = null;
      }
      else if (c === "rate_limited") toast("Saving too often. Wait a minute, then save again.", 6000);
      else if (c === "too_large") toast("The site is too large to save. Shorten a long text and try again.", 6000);
      else toast("Couldn’t publish (" + ((err && err.message) || "unknown error") + "). Try again.", 7000);
    });
  }
})();
</script>

</body>
</html>
